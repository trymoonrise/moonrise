<!DOCTYPE html>

<style>html.ms-hold body{visibility:hidden!important}</style>
<script>document.documentElement.classList.add("ms-hold");document.addEventListener("DOMContentLoaded",function(){if(!document.getElementById("shell"))document.documentElement.classList.remove("ms-hold")});setTimeout(function(){document.documentElement.classList.remove("ms-hold")},4000);</script>
  <script>
    (function () {
      var BUILD = "20261002-ldb-support";
      try {
        var prev = localStorage.getItem("ms_asset_build");
        localStorage.setItem("ms_asset_build", BUILD);
        if (prev && prev !== BUILD && !sessionStorage.getItem("ms_build_reloaded_" + BUILD)) {
          sessionStorage.setItem("ms_build_reloaded_" + BUILD, "1");
          var jobs = [];
          if ("serviceWorker" in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all((regs || []).map(function (r) { return r.unregister(); }));
            }));
          }
          if ("caches" in window) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all((keys || []).map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.allSettled(jobs).then(function () {
            var url = new URL(location.href);
            url.searchParams.set("_ms_b", BUILD);
            location.replace(url.pathname + url.search + url.hash);
          });
        }
      } catch (e) {}
    })();
  </script>
