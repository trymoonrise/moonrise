<!DOCTYPE html>
<html lang="en">
<head>
<style>
html.ms-boot body{visibility:hidden!important}
#ms-boot{position:fixed;inset:0;z-index:2147483646;display:grid;place-items:center;align-content:center;gap:1.25rem;background:#ffffff;color:#232427;visibility:visible!important;opacity:1;transition:opacity .22s ease-out,visibility .22s linear}
html[data-ms-mode=dark] #ms-boot{background:#111111;color:#f5f5f5}
html[data-ms-mode=dark] #ms-boot .ms-boot-bar{background:rgba(245,245,245,.14)}
#ms-boot.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
#ms-boot p{margin:0;font:600 1.4rem/1 system-ui,sans-serif;letter-spacing:-.04em;opacity:0;animation:ms-boot-word .32s cubic-bezier(.22,1,.36,1) forwards}
#ms-boot .ms-boot-bar{width:9rem;height:2.75px;border-radius:99px;background:rgba(15,23,42,.1);overflow:hidden;opacity:0;animation:ms-boot-word .32s cubic-bezier(.22,1,.36,1) .04s forwards}
#ms-boot .ms-boot-bar span{display:block;height:100%;width:100%;border-radius:inherit;background:currentColor;transform:scaleX(0);transform-origin:left center;will-change:transform;transition:transform .2s cubic-bezier(.22,1,.36,1)}
@keyframes ms-boot-word{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#ms-boot,#ms-boot p,#ms-boot .ms-boot-bar{transition:none!important;animation:none!important;opacity:1!important;transform:none!important}#ms-boot .ms-boot-bar span{transition:none!important}}
</style>
<script>
(function(){
  var tabHop=false;
  try{tabHop=!!sessionStorage.getItem("ms_tab_switch")||sessionStorage.getItem("ms_studio_booted")==="1"}catch(e){}
  if(tabHop){
    document.documentElement.classList.add("ms-boot-done");
    window.__msBootReleased=1;
    window.__msTabHop=1;
    return;
  }
  document.documentElement.classList.add("ms-boot");
  try{if("scrollRestoration" in history)history.scrollRestoration="manual"}catch(e){}
  try{window.scrollTo(0,0)}catch(e){}
  var boot=document.createElement("div");
  boot.id="ms-boot";
  boot.setAttribute("role","progressbar");
  boot.setAttribute("aria-label","Loading");
  boot.setAttribute("aria-valuemin","0");
  boot.setAttribute("aria-valuemax","100");
  boot.setAttribute("aria-valuenow","0");
  boot.innerHTML='<p>moonrise.</p><div class="ms-boot-bar" aria-hidden="true"><span></span></div>';
  document.documentElement.appendChild(boot);
  var bar=boot.querySelector(".ms-boot-bar span");
  var progress=0;
  var appReady=false;
  var assetsReady=false;
  var ready=false;
  var done=false;
  var started=performance.now();
  var readyAt=0;
  var minMs=0;
  var maxMs=2500;
  var failMs=5000;
  var reduce=false;
  try{reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}

  function gating(){
    return document.documentElement.classList.contains("ms-auth-gating");
  }

  function studioPending(){
    return !!window.__msStudioBoot && !(document.body && document.body.dataset.msShellPainted==="1");
  }

  function forceReveal(){
    document.documentElement.classList.remove("ms-boot");
    document.documentElement.classList.remove("ms-hold");
    document.documentElement.classList.remove("ms-auth-gating");
    document.documentElement.classList.add("ms-boot-done");
    window.__msStudioBoot=0;
    window.__msBootReleased=1;
    var el=document.getElementById("ms-boot");
    if(el)el.remove();
  }

  function failTo404(){
    if(window.__msAuthRedirecting)return;
    window.__msAuthRedirecting=true;
    forceReveal();
    location.replace("404");
  }

  function setProgress(p){
    progress=Math.max(0,Math.min(100,p));
    if(bar) bar.style.transform="scaleX("+(progress/100).toFixed(4)+")";
    boot.setAttribute("aria-valuenow",String(Math.round(progress)));
    boot.setAttribute("aria-label","Loading "+Math.round(progress)+"%");
  }

  function finish(){
    if(done)return true;
    // Keep the moonrise bar up until the studio shell paints.
    if(gating() || studioPending()){
      setProgress(Math.max(progress, 92));
      return false;
    }
    done=true;
    window.__msBootReleased=1;
    setProgress(100);
    var hide=function(){
      document.documentElement.classList.remove("ms-boot");
      document.documentElement.classList.remove("ms-hold");
      document.documentElement.classList.add("ms-boot-done");
      var el=document.getElementById("ms-boot");
      if(el)el.remove();
    };
    if(reduce){
      hide();
      return true;
    }
    boot.classList.add("is-leaving");
    setTimeout(hide, 220);
    return true;
  }

  function markReady(){
    if(ready||done)return;
    if(!(appReady&&assetsReady))return;
    ready=true;
    readyAt=performance.now();
  }

  function tick(now){
    if(done)return;
    var elapsed=now-started;
    // Absolute escape: never sit on a blank/hold screen past failMs.
    if(elapsed>=failMs && (gating() || studioPending() || document.getElementById("ms-boot"))){
      failTo404();
      return;
    }
    if(ready){
      if(reduce){
        setProgress(100);
        if(finish()) return;
      }else{
        var sinceReady=Math.max(0,now-readyAt);
        var minLeft=Math.max(0,minMs-elapsed);
        var fillMs=Math.max(100,minLeft);
        var t=Math.min(1,sinceReady/fillMs);
        var eased=1-Math.pow(1-t,3);
        var from=Math.max(progress, 82);
        setProgress(from+((100-from)*eased));
        if(t>=1 && progress>=99.4){
          setProgress(100);
          if(finish()) return;
        }
      }
    }else{
      var tWait=Math.min(1,elapsed/1200);
      var target=84*(1-Math.pow(1-tWait,2.4));
      setProgress(progress+(target-progress)*0.18);
      if(elapsed>=maxMs){
        if(gating() || studioPending()){
          setProgress(Math.max(progress, 92));
        }else{
          appReady=true;
          assetsReady=true;
          markReady();
        }
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.__msReleaseBoot=function(){
    appReady=true;
    assetsReady=true;
    markReady();
    if(ready && !done && !gating() && !studioPending()) finish();
  };

  function markAssets(){
    assetsReady=true;
    markReady();
  }

  function releasePublicApp(){
    if(gating() || window.__msStudioBoot) return;
    appReady=true;
    markReady();
  }

  function onDomReady(){
    markAssets();
    releasePublicApp();
  }

  if(document.readyState==="interactive"||document.readyState==="complete") onDomReady();
  else document.addEventListener("DOMContentLoaded", onDomReady, { once:true });
  setTimeout(markAssets, maxMs);
  setTimeout(function(){
    if(done) return;
    if(gating() || studioPending()) return;
    if(window.__msReleaseBoot) window.__msReleaseBoot();
  }, maxMs);
  // Wall-clock backup if rAF is throttled/frozen.
  setTimeout(function(){
    if(done || window.__msAuthRedirecting) return;
    if(gating() || studioPending() || document.getElementById("ms-boot")) failTo404();
  }, failMs + 250);
})();
</script>
  <script>
    (function () {
      var BUILD = "20261107-accent-btn";
      try {
        var prev = localStorage.getItem("ms_asset_build");
        localStorage.setItem("ms_asset_build", BUILD);
        if (prev && prev !== BUILD && !sessionStorage.getItem("ms_build_reloaded_" + BUILD)) {
          sessionStorage.setItem("ms_build_reloaded_" + BUILD, "1");
          var jobs = [];
          if ("serviceWorker" in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all((regs || []).map(function (r) { return r.unregister(); }));
            }));
          }
          if ("caches" in window) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all((keys || []).map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.allSettled(jobs).then(function () {
            var url = new URL(location.href);
            url.searchParams.set("_ms_b", BUILD);
            location.replace(url.pathname + url.search + url.hash);
          });
        }
      } catch (e) {}
    })();
  </script>

<body data-page="calendar">
  <div id="shell"></div>
  <div id="page-body" class="ms-cal-page">
    <div class="ms-cal" id="cal-app" hidden>
      <div class="ms-cal-head">
        <button type="button" class="ms-cal-month" id="cal-month" aria-expanded="false" aria-controls="cal-picker">
          <span id="cal-month-label">November 2026</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="ms-cal-nav">
          <button type="button" class="ms-cal-add" id="cal-add">Add</button>
          <button type="button" class="ms-cal-shift" id="cal-prev" aria-label="Previous month">‹</button>
          <button type="button" class="ms-cal-shift" id="cal-next" aria-label="Next month">›</button>
        </div>
      </div>
      <form class="ms-cal-form" id="cal-form" hidden>
        <input id="cal-form-date" type="date" required aria-label="Day">
        <input id="cal-form-time" type="time" required aria-label="Time">
        <input id="cal-form-mins" type="number" min="5" max="480" step="5" value="30" required aria-label="Minutes">
        <input id="cal-form-name" type="text" maxlength="120" placeholder="Name" aria-label="Name">
        <input id="cal-form-contact" type="text" maxlength="200" placeholder="Email or phone" aria-label="Email or phone">
        <input id="cal-form-site" type="text" maxlength="120" placeholder="Site" aria-label="Site">
        <input id="cal-form-link" type="url" maxlength="300" placeholder="Meeting link" aria-label="Meeting link">
        <div class="ms-cal-form-actions">
          <button type="submit" class="ms-cal-form-save" id="cal-form-save">Save event</button>
          <button type="button" class="ms-cal-form-cancel" id="cal-form-cancel">Cancel</button>
        </div>
      </form>
      <div class="ms-cal-picker" id="cal-picker" hidden>
        <div class="ms-cal-year">
          <button type="button" id="cal-year-prev" aria-label="Previous year">‹</button>
          <span id="cal-year-label">2026</span>
          <button type="button" id="cal-year-next" aria-label="Next year">›</button>
        </div>
        <div class="ms-cal-months" id="cal-months"></div>
      </div>
      <div class="ms-cal-week" aria-hidden="true">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div class="ms-cal-grid" id="cal-grid" aria-label="Month"></div>
      <p class="ms-cal-empty" id="cal-day-empty" hidden>No meetings</p>
      <div class="ms-cal-detail" id="cal-detail" aria-hidden="true">
        <div class="ms-cal-detail-clip">
          <div class="ms-cal-detail-card" id="cal-detail-card"></div>
        </div>
      </div>
      <p class="ms-error" id="cal-error" hidden></p>
    </div>

    <div class="ms-cal-gate" id="cal-gate" hidden role="dialog" aria-modal="true" aria-labelledby="cal-gate-title">
      <div class="ms-cal-gate-card">
        <h1 id="cal-gate-title">Connect Cal.com</h1>
        <p id="cal-gate-copy">Continue with Cal.com to see your meetings here.</p>
        <div class="ms-cal-gate-actions">
          <button type="button" class="ms-cal-oauth" id="cal-oauth">Continue with Cal.com</button>
        </div>
        <p class="ms-error" id="cal-gate-error" hidden></p>
      </div>
    </div>

  </div>
