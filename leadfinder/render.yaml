# LeadFinder Cloud
# - Cron: hourly seed scraper → Discord / Supabase
# - Web: 24/7 live Business Finder search API (Playwright)

services:
  - type: web
    name: leadfinder-search
    runtime: docker
    rootDir: leadfinder
    dockerfilePath: ./Dockerfile.search
    plan: standard
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: HEADLESS
        value: "1"
      - key: LEADFINDER_SEARCH_HOST
        value: "0.0.0.0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LEADFINDER_SEARCH_SECRET
        sync: false

  - type: cron
    name: leadfinder-cloud
    runtime: docker
    rootDir: leadfinder
    dockerfilePath: ./Dockerfile
    plan: starter
    schedule: "0 * * * *"
    envVars:
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HEADLESS
        value: "1"
      - key: QUERIES_PER_RUN
        value: "3"
      - key: DISCORD_BATCH_SIZE
        value: "1000"
      - key: SCRAPE_EVERY_TIME
        value: "1"
      - key: MAX_SCROLLS
        value: "220"
      - key: LEADFINDER_STATE_BUCKET
        value: "leadfinder-cloud"
      - key: LEADFINDER_STATE_OBJECT
        value: "cloud-state.json"
