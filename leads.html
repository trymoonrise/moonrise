html.ms-boot body{visibility:hidden!important}
#ms-boot{position:fixed;inset:0;z-index:2147483646;display:grid;place-items:center;align-content:center;gap:1.15rem;background:#fcfbef;color:#232427;visibility:visible!important}
#ms-boot p{margin:0;font:600 1.35rem/1 system-ui,sans-serif;letter-spacing:-.04em}
#ms-boot .ms-boot-bar{width:7.5rem;height:2px;border-radius:99px;background:rgba(15,23,42,.12);overflow:hidden}
#ms-boot .ms-boot-bar span{display:block;height:100%;width:0%;border-radius:inherit;background:currentColor;transform-origin:left center}
@media (prefers-reduced-motion:reduce){#ms-boot .ms-boot-bar span{transition:none}}
</style>
<script>
document.documentElement.classList.add("ms-boot");
(function(){
  var boot=document.createElement("div");
  boot.id="ms-boot";
  boot.setAttribute("role","progressbar");
  boot.setAttribute("aria-label","Loading");
  boot.setAttribute("aria-valuemin","0");
  boot.setAttribute("aria-valuemax","100");
  boot.setAttribute("aria-valuenow","0");
  boot.innerHTML='<p>moonrise.</p><div class="ms-boot-bar" aria-hidden="true"><span></span></div>';
  document.documentElement.appendChild(boot);
  var bar=boot.querySelector(".ms-boot-bar span");
  var progress=0;
  var ready=false;
  var done=false;
  var started=performance.now();
  var readyAt=0;
  var minMs=750;
  var maxMs=20000;
  var reduce=false;
  try{reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}

  function setProgress(p){
    progress=Math.max(0,Math.min(100,p));
    if(bar) bar.style.width=progress.toFixed(2)+"%";
    boot.setAttribute("aria-valuenow",String(Math.round(progress)));
    boot.setAttribute("aria-label","Loading "+Math.round(progress)+"%");
  }

  function finish(){
    if(done)return;
    done=true;
    window.__msBootReleased=1;
    setProgress(100);
    var hide=function(){
      document.documentElement.classList.remove("ms-boot","ms-hold");
      document.documentElement.classList.add("ms-boot-done");
      var el=document.getElementById("ms-boot");
      if(el)el.remove();
    };
    requestAnimationFrame(function(){requestAnimationFrame(hide);});
  }

  function tick(now){
    if(done)return;
    var elapsed=now-started;
    if(ready){
      if(reduce){
        setProgress(100);
        finish();
        return;
      }
      var sinceReady=Math.max(0,now-readyAt);
      var minLeft=Math.max(0,minMs-elapsed);
      var fillMs=Math.max(220,minLeft);
      var t=Math.min(1,sinceReady/fillMs);
      var eased=1-Math.pow(1-t,3);
      setProgress(Math.max(progress, 88+(12*eased)));
      if(t>=1 && progress>=99.5){
        setProgress(100);
        finish();
        return;
      }
    }else{
      var tWait=Math.min(1,elapsed/2600);
      var target=82*(1-Math.pow(1-tWait,2.4));
      setProgress(progress+(target-progress)*0.16);
      if(elapsed>=maxMs){
        ready=true;
        readyAt=now;
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.__msReleaseBoot=function(){
    if(ready||done)return;
    ready=true;
    readyAt=performance.now();
  };
  setTimeout(function(){ if(window.__msReleaseBoot) window.__msReleaseBoot(); },maxMs);
})();
</script>
  <script>
    (function () {
      var BUILD = "20261005-osm";
      try {
        var prev = localStorage.getItem("ms_asset_build");
        localStorage.setItem("ms_asset_build", BUILD);
        // Only hard-reload when the build token changes (keeps repeat visits fast).
        if (prev && prev !== BUILD && !sessionStorage.getItem("ms_build_reloaded_" + BUILD)) {
          sessionStorage.setItem("ms_build_reloaded_" + BUILD, "1");
          var jobs = [];
          if ("serviceWorker" in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all((regs || []).map(function (r) { return r.unregister(); }));
            }));
          }
          if ("caches" in window) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all((keys || []).map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.allSettled(jobs).then(function () {
            var url = new URL(location.href);
            url.searchParams.set("_ms_b", BUILD);
            location.replace(url.pathname + url.search + url.hash);
          });
        }
      } catch (e) {}
    })();
  </script>

        flex-direction: column !important;

        gap: 0.55rem !important;
      }
      body[data-page="leads"] .ms-lf-map-top-row,
      body[data-page="leads"] .ms-lf-map-search,
      body[data-page="leads"] #lf-form.ms-lf-map-search,

<body data-page="leads">
  <div id="shell"></div>
  <div id="page-body" class="ms-lf-page ms-lf-page--map">
    <header class="ms-page-head ms-lf-map-head">
      <div class="ms-page-head-copy">
        <h1>Business Finder</h1>
      </div>
    </header>

    <div class="ms-lf-map-stage is-map-loading" id="lf-map-stage">
      <div id="lf-map" class="ms-lf-map" role="application" aria-label="Business map"></div>
      <div class="ms-lf-map-loader" id="lf-map-loader" role="status" aria-live="polite" aria-busy="true">
        <div class="ms-lf-map-loader-orb" aria-hidden="true">
          <span class="ms-lf-map-loader-ring"></span>
        </div>
        <p class="ms-lf-map-loader-label">Loading map</p>
      </div>
      <script>
        // Failsafe: never leave Finder stuck on the loader if map JS fails to boot.
        (function () {
          window.setTimeout(function () {
            var stage = document.getElementById("lf-map-stage");
            if (stage && stage.classList.contains("is-map-loading")) {
              stage.classList.remove("is-map-loading");
              var loader = document.getElementById("lf-map-loader");
              if (loader) loader.setAttribute("aria-busy", "false");
            }
          }, 3500);
        })();
      </script>

      <div class="ms-lf-map-overlays">
        <div class="ms-lf-map-top">
          <div class="ms-lf-map-top-row">
            <form class="ms-lf-map-search" id="lf-form" autocomplete="off" action="#">
              <div class="ms-lf-map-pill" id="lf-search-pill" data-mode="idle">
                <div class="ms-lf-map-pill-tray">
                  <button type="button" class="ms-lf-map-chip ms-lf-map-menu" id="lf-menu-toggle" aria-label="Open menu" title="Menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                  </button>
                  <button type="button" class="ms-lf-map-chip ms-lf-map-search-btn" id="lf-search-toggle" aria-label="Search for a business" title="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
                  </button>
                  <div class="ms-lf-map-chip ms-lf-map-chip--count ms-lf-map-pill-body">
                    <span class="ms-lf-map-count" id="lf-list-count" aria-live="polite">0 Businesses</span>
                    <label class="ms-lf-map-search-field" for="lf-query">
                      <span class="ms-sr-only">Search for a business</span>
                      <input
                        id="lf-query"
                        name="query"
                        type="search"
                        placeholder="Search for a business"
                        autocomplete="off"
                        enterkeyhint="search"
                      >
                    </label>
                  </div>
                  <button type="button" class="ms-lf-map-chip ms-lf-map-filter" id="lf-filter-open" aria-label="Filter businesses" aria-expanded="false" aria-controls="lf-filter-sheet" title="Filter">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.15" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6.2 7.4V19l-3.6 1.6v-8.2L4 5z"/></svg>
                  </button>
                  <button type="button" class="ms-lf-map-chip ms-lf-map-locate" id="lf-locate" aria-label="Center on my location" title="My location">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 4.5 19.5 12 15.5 19.5 19.5 12 2z"/></svg>
                  </button>
                  <button type="button" class="ms-lf-map-chip ms-lf-map-search-close" id="lf-search-close" aria-label="Close search" title="Close search" tabindex="-1" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                  </button>
                </div>
              </div>

              <input type="hidden" id="lf-type" name="type" value="">
              <input type="hidden" id="lf-location" name="location" value="">
              <input type="checkbox" id="lf-area-toggle" hidden tabindex="-1" aria-hidden="true">
            </form>
          </div>

        </div>

        <aside class="ms-lf-map-panel" id="lf-results-panel" hidden aria-label="Business results">
          <div
            class="ms-lf-map-panel-handle"
            id="lf-sheet-handle"
            role="slider"
            tabindex="0"
            aria-label="Resize results sheet"
            aria-orientation="vertical"
            aria-valuemin="0"
            aria-valuemax="2"
            aria-valuenow="1"
          ></div>
          <p class="ms-muted ms-lf-status" id="lf-status" hidden></p>
          <p class="ms-error" id="lf-error" hidden></p>
          <div class="ms-lead-list ms-lf-map-results" id="lf-results"></div>
        </aside>

        <div class="ms-lf-filter-sheet" id="lf-filter-sheet" hidden>
          <button type="button" class="ms-lf-filter-scrim" id="lf-filter-scrim" aria-label="Close filters"></button>
          <div class="ms-lf-filter-card" role="dialog" aria-modal="true" aria-labelledby="lf-filter-title">
            <div class="ms-lf-filter-head">
              <h2 id="lf-filter-title">Filter businesses</h2>
              <button type="button" class="ms-lf-filter-close" id="lf-filter-close" aria-label="Close filters">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
              </button>
            </div>
            <div id="lf-website-filter" role="group" aria-label="Website filter">
              <button type="button" class="ms-lf-filter-option" data-website="all" aria-pressed="false">
                <span>All businesses</span>
              </button>
              <button type="button" class="ms-lf-filter-option is-active" data-website="without" aria-pressed="true">
                <span>No website</span>
              </button>
              <button type="button" class="ms-lf-filter-option" data-website="with" aria-pressed="false">
                <span>Has a website</span>
              </button>
            </div>
          </div>
        </div>

        <div class="ms-lf-map-actions">
          <div class="ms-lf-map-actions-tray">
            <button type="button" class="ms-btn ms-lf-map-scan" id="lf-scan-near">Scan nearby</button>
            <button type="button" class="ms-btn ms-lf-map-all" id="lf-scan-all" aria-label="Scan all businesses in the state" title="All businesses in the state">All</button>
          </div>
        </div>
      </div>
    </div>
