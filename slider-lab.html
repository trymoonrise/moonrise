<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Drag Slider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;1,9..40,500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0f12;
      --bg-glow: radial-gradient(ellipse 80% 50% at 50% 40%, #1a222c 0%, transparent 70%);
      --ink: #e8ecef;
      --muted: #8b969f;
      --track: #1c242c;
      --track-edge: #2a3540;
      --fill: #3d9bfd;
      --fill-soft: color-mix(in srgb, var(--fill) 28%, transparent);
      --thumb: #f4f7fa;
      --thumb-shadow: 0 2px 12px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
      --toggle-bg: #171d24;
      --toggle-border: #2a3540;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-theme="light"] {
      --bg: #f2f0eb;
      --bg-glow: radial-gradient(ellipse 80% 50% at 50% 38%, #ffffff 0%, transparent 68%);
      --ink: #14181c;
      --muted: #5c6770;
      --track: #e0ddd6;
      --track-edge: #cdc8be;
      --fill: #0b6bcb;
      --fill-soft: color-mix(in srgb, var(--fill) 22%, transparent);
      --thumb: #ffffff;
      --thumb-shadow: 0 2px 14px rgba(20, 24, 28, 0.18), 0 0 0 1px rgba(20, 24, 28, 0.06);
      --toggle-bg: #ffffff;
      --toggle-border: #d4d0c8;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
        max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      background-image: var(--bg-glow);
      transition: background-color 0.35s var(--ease), color 0.35s var(--ease);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .stage {
      width: min(100%, 28rem);
      display: grid;
      gap: 1.75rem;
      justify-items: center;
      text-align: center;
    }

    .brand {
      margin: 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2rem, 6vw, 2.75rem);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .hint {
      margin: -0.75rem 0 0;
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 500;
    }

    .value {
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--muted);
      min-height: 1.25rem;
    }

    .value strong {
      color: var(--ink);
      font-weight: 600;
    }

    /* -- Slider -- */
    .slider {
      --x: 0;
      --max: 0;
      width: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .slider-track {
      position: relative;
      height: 3.25rem;
      border-radius: 999px;
      background: var(--track);
      box-shadow: inset 0 0 0 1px var(--track-edge);
      cursor: grab;
      overflow: hidden;
      isolation: isolate;
    }

    .slider.is-dragging .slider-track {
      cursor: grabbing;
    }

    .slider-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: calc(var(--x) * 1px + 1.625rem);
      max-width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--fill-soft), var(--fill));
      pointer-events: none;
      will-change: width;
    }

    .slider:not(.is-dragging) .slider-fill,
    .slider:not(.is-dragging) .slider-thumb {
      transition: transform 0.18s var(--ease), width 0.18s var(--ease);
    }

    .slider-thumb {
      position: absolute;
      top: 50%;
      left: 0;
      width: 2.75rem;
      height: 2.75rem;
      margin-top: -1.375rem;
      border-radius: 50%;
      background: var(--thumb);
      box-shadow: var(--thumb-shadow);
      transform: translate3d(calc(var(--x) * 1px), 0, 0);
      will-change: transform;
      pointer-events: none;
      display: grid;
      place-items: center;
    }

    .slider-thumb::after {
      content: "";
      width: 0.85rem;
      height: 0.28rem;
      border-radius: 2px;
      background: color-mix(in srgb, var(--ink) 22%, transparent);
    }

    .slider.is-dragging .slider-thumb {
      scale: 1.06;
    }

    /* -- Theme toggle -- */
    .theme-toggle {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      right: max(1rem, env(safe-area-inset-right));
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.4rem 0.7rem 0.4rem 0.45rem;
      border-radius: 999px;
      border: 1px solid var(--toggle-border);
      background: var(--toggle-bg);
      color: var(--ink);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      transition: background 0.25s var(--ease), border-color 0.25s var(--ease),
        transform 0.15s var(--ease);
      z-index: 10;
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
    }

    .theme-toggle:active {
      transform: translateY(0);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--fill);
      outline-offset: 3px;
    }

    .theme-toggle__icon {
      width: 1.65rem;
      height: 1.65rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--track);
      font-size: 0.85rem;
      line-height: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="true" title="Toggle theme">
    <span class="theme-toggle__icon" aria-hidden="true">☾</span>
    <span class="theme-toggle__label">Dark</span>
  </button>

  <main class="stage">
    <h1 class="brand">Slide</h1>
    <p class="hint">Drag the handle - it tracks while you hold</p>

    <div
      class="slider"
      id="slider"
      role="slider"
      tabindex="0"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
      aria-label="Value slider"
    >
      <div class="slider-track" id="track">
        <div class="slider-fill" id="fill" aria-hidden="true"></div>
        <div class="slider-thumb" id="thumb" aria-hidden="true"></div>
      </div>
    </div>

    <p class="value"><strong id="value-label">0</strong>%</p>
  </main>

  <script>
    (function () {
      const root = document.documentElement;
      const toggle = document.getElementById("theme-toggle");
      const icon = toggle.querySelector(".theme-toggle__icon");
      const label = toggle.querySelector(".theme-toggle__label");
      const slider = document.getElementById("slider");
      const track = document.getElementById("track");
      const valueLabel = document.getElementById("value-label");

      const THEME_KEY = "ms_drag_slider_theme";
      const THUMB = 44; // matches 2.75rem at 16px

      let maxX = 0;
      let value = 0; // 0..1
      let dragging = false;
      let activePointerId = null;
      let raf = 0;
      let pendingX = null;

      function applyTheme(theme) {
        const next = theme === "light" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        const isDark = next === "dark";
        toggle.setAttribute("aria-pressed", isDark ? "true" : "false");
        icon.textContent = isDark ? "☾" : "☼";
        label.textContent = isDark ? "Dark" : "Light";
        try {
          localStorage.setItem(THEME_KEY, next);
        } catch (_) {}
      }

      function initTheme() {
        let saved = "";
        try {
          saved = localStorage.getItem(THEME_KEY) || "";
        } catch (_) {}
        if (saved === "light" || saved === "dark") {
          applyTheme(saved);
          return;
        }
        applyTheme(
          window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
        );
      }

      toggle.addEventListener("click", () => {
        applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
      });

      function measure() {
        const rect = track.getBoundingClientRect();
        maxX = Math.max(0, rect.width - THUMB);
        slider.style.setProperty("--max", String(maxX));
        setValue(value, false);
      }

      function setValue(next, announce) {
        value = Math.min(1, Math.max(0, next));
        const x = value * maxX;
        slider.style.setProperty("--x", String(x));
        const pct = Math.round(value * 100);
        valueLabel.textContent = String(pct);
        slider.setAttribute("aria-valuenow", String(pct));
        if (announce) {
          /* live region optional - valuetext is enough for SR */
        }
      }

      function clientToValue(clientX) {
        const rect = track.getBoundingClientRect();
        const x = clientX - rect.left - THUMB / 2;
        if (maxX <= 0) return 0;
        return Math.min(1, Math.max(0, x / maxX));
      }

      function scheduleSet(clientX) {
        pendingX = clientX;
        if (raf) return;
        raf = requestAnimationFrame(() => {
          raf = 0;
          if (pendingX == null) return;
          setValue(clientToValue(pendingX), false);
          pendingX = null;
        });
      }

      function onPointerDown(e) {
        if (e.button != null && e.button !== 0) return;
        dragging = true;
        activePointerId = e.pointerId;
        slider.classList.add("is-dragging");
        track.setPointerCapture(e.pointerId);
        scheduleSet(e.clientX);
        e.preventDefault();
      }

      function onPointerMove(e) {
        if (!dragging || e.pointerId !== activePointerId) return;
        scheduleSet(e.clientX);
        e.preventDefault();
      }

      function endDrag(e) {
        if (!dragging) return;
        if (e && activePointerId != null && e.pointerId !== activePointerId) return;
        dragging = false;
        activePointerId = null;
        slider.classList.remove("is-dragging");
        if (pendingX != null) {
          setValue(clientToValue(pendingX), true);
          pendingX = null;
        }
      }

      track.addEventListener("pointerdown", onPointerDown);
      track.addEventListener("pointermove", onPointerMove);
      track.addEventListener("pointerup", endDrag);
      track.addEventListener("pointercancel", endDrag);
      track.addEventListener("lostpointercapture", endDrag);

      slider.addEventListener("keydown", (e) => {
        const step = e.shiftKey ? 0.1 : 0.02;
        if (e.key === "ArrowRight" || e.key === "ArrowUp") {
          e.preventDefault();
          setValue(value + step, true);
        } else if (e.key === "ArrowLeft" || e.key === "ArrowDown") {
          e.preventDefault();
          setValue(value - step, true);
        } else if (e.key === "Home") {
          e.preventDefault();
          setValue(0, true);
        } else if (e.key === "End") {
          e.preventDefault();
          setValue(1, true);
        }
      });

      window.addEventListener("resize", measure);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", measure);
      }

      initTheme();
      measure();
    })();
  </script>
</body>
</html>
