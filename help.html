<style>
html.ms-boot body{visibility:hidden!important}
#ms-boot{position:fixed;inset:0;z-index:2147483646;display:grid;place-items:center;align-content:center;gap:1.25rem;background:#ffffff;color:#232427;visibility:visible!important;opacity:1;transition:opacity .22s ease-out,visibility .22s linear}
#ms-boot.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
#ms-boot p{margin:0;font:600 1.4rem/1 system-ui,sans-serif;letter-spacing:-.04em;opacity:0;animation:ms-boot-word .32s cubic-bezier(.22,1,.36,1) forwards}
#ms-boot .ms-boot-bar{width:9rem;height:2.75px;border-radius:99px;background:rgba(15,23,42,.1);overflow:hidden;opacity:0;animation:ms-boot-word .32s cubic-bezier(.22,1,.36,1) .04s forwards}
#ms-boot .ms-boot-bar span{display:block;height:100%;width:100%;border-radius:inherit;background:currentColor;transform:scaleX(0);transform-origin:left center;will-change:transform;transition:transform .2s cubic-bezier(.22,1,.36,1)}
@keyframes ms-boot-word{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#ms-boot,#ms-boot p,#ms-boot .ms-boot-bar{transition:none!important;animation:none!important;opacity:1!important;transform:none!important}#ms-boot .ms-boot-bar span{transition:none!important}}
</style>
<script>
document.documentElement.classList.add("ms-boot");
(function(){
  var boot=document.createElement("div");
  boot.id="ms-boot";
  boot.setAttribute("role","progressbar");
  boot.setAttribute("aria-label","Loading");
  boot.setAttribute("aria-valuemin","0");
  boot.setAttribute("aria-valuemax","100");
  boot.setAttribute("aria-valuenow","0");
  boot.innerHTML='<p>moonrise.</p><div class="ms-boot-bar" aria-hidden="true"><span></span></div>';
  document.documentElement.appendChild(boot);
  var bar=boot.querySelector(".ms-boot-bar span");
  var progress=0;
  var appReady=false;
  var assetsReady=false;
  var ready=false;
  var done=false;
  var started=performance.now();
  var readyAt=0;
  var minMs=220;
  var maxMs=8000;
  var reduce=false;
  try{reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}

  function setProgress(p){
    progress=Math.max(0,Math.min(100,p));
    if(bar) bar.style.transform="scaleX("+(progress/100).toFixed(4)+")";
    boot.setAttribute("aria-valuenow",String(Math.round(progress)));
    boot.setAttribute("aria-label","Loading "+Math.round(progress)+"%");
  }

  function finish(){
    if(done)return;
    done=true;
    window.__msBootReleased=1;
    setProgress(100);
    var hide=function(){
      document.documentElement.classList.remove("ms-boot");
      if(!document.documentElement.classList.contains("ms-auth-gating")){
        document.documentElement.classList.remove("ms-hold");
      }
      document.documentElement.classList.add("ms-boot-done");
      var el=document.getElementById("ms-boot");
      if(el)el.remove();
    };
    if(reduce){
      hide();
      return;
    }
    boot.classList.add("is-leaving");
    setTimeout(hide, 220);
  }

  function markReady(){
    if(ready||done)return;
    if(!(appReady&&assetsReady))return;
    ready=true;
    readyAt=performance.now();
  }

  function tick(now){
    if(done)return;
    var elapsed=now-started;
    if(ready){
      if(reduce){
        setProgress(100);
        finish();
        return;
      }
      var sinceReady=Math.max(0,now-readyAt);
      var minLeft=Math.max(0,minMs-elapsed);
      var fillMs=Math.max(120,minLeft);
      var t=Math.min(1,sinceReady/fillMs);
      var eased=1-Math.pow(1-t,3);
      var from=Math.max(progress, 82);
      setProgress(from+((100-from)*eased));
      if(t>=1 && progress>=99.4){
        setProgress(100);
        finish();
        return;
      }
    }else{
      var tWait=Math.min(1,elapsed/1600);
      var target=84*(1-Math.pow(1-tWait,2.4));
      setProgress(progress+(target-progress)*0.14);
      if(elapsed>=maxMs){
        appReady=true;
        assetsReady=true;
        markReady();
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.__msReleaseBoot=function(){
    appReady=true;
    markReady();
  };

  function markAssets(){
    assetsReady=true;
    markReady();
  }

  function releasePublicApp(){
    // Auth-gated studio pages wait for app.js; public pages lift as soon as the DOM is ready.
    if(document.documentElement.classList.contains("ms-auth-gating")) return;
    appReady=true;
    markReady();
  }

  function onDomReady(){
    markAssets();
    releasePublicApp();
  }

  if(document.readyState==="interactive"||document.readyState==="complete") onDomReady();
  else document.addEventListener("DOMContentLoaded", onDomReady, { once:true });
  setTimeout(markAssets, maxMs);
  setTimeout(function(){ if(window.__msReleaseBoot) window.__msReleaseBoot(); },maxMs);
})();
</script>
  <script>
    (function () {
      var BUILD = "20260924-drawer-ease";
      try {
        var prev = localStorage.getItem("ms_asset_build");
        localStorage.setItem("ms_asset_build", BUILD);
        if (prev && prev !== BUILD && !sessionStorage.getItem("ms_build_reloaded_" + BUILD)) {
          sessionStorage.setItem("ms_build_reloaded_" + BUILD, "1");
          var jobs = [];
          if ("serviceWorker" in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all((regs || []).map(function (r) { return r.unregister(); }));
            }));
          }
          if ("caches" in window) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all((keys || []).map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.allSettled(jobs).then(function () {
            var url = new URL(location.href);
            url.searchParams.set("_ms_b", BUILD);
            location.replace(url.pathname + url.search + url.hash);
          });
        }
      } catch (e) {}
    })();
  </script>

  <script>
    (async function () {
      const saveBtn = document.getElementById("help-save-contact");
      const shareBtn = document.getElementById("help-share-contact");

      const CONTACT = {
        name: "Moonrise",
        org: "Moonrise Studio",
        title: "trymoonrise.com",
        phone: "+14013000957",
        phoneDisplay: "(401) 300-0957",
        email: "trymoonrise@gmail.com",
        url: "https://trymoonrise.com",
        instagram: "https://www.instagram.com/trymoonrise/",
      };

      function buildVCard() {
        return [
          "BEGIN:VCARD",
          "VERSION:3.0",
          "N:Moonrise;;;;",
          "FN:" + CONTACT.name,
          "ORG:" + CONTACT.org,
          "TITLE:" + CONTACT.title,
          "TEL;TYPE=CELL,VOICE:" + CONTACT.phone,
          "EMAIL;TYPE=INTERNET:" + CONTACT.email,
          "URL:" + CONTACT.url,
          "URL;TYPE=Instagram:" + CONTACT.instagram,
          "NOTE:trymoonrise.com ? Moonrise Studio",
          "END:VCARD",
        ].join("\r\n");
      }

      function downloadVCard() {
        const blob = new Blob([buildVCard()], { type: "text/vcard;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Moonrise.vcf";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        window.StudioToast?.success?.("Contact saved");
      }

      saveBtn?.addEventListener("click", downloadVCard);

      shareBtn?.addEventListener("click", async () => {
        const shareData = {
          title: "Moonrise",
          text: "Moonrise ? trymoonrise.com\n" + CONTACT.phoneDisplay + "\n" + CONTACT.email + "\n" + CONTACT.instagram,
          url: location.href.split("#")[0],
        };
        try {
          if (navigator.share) {
            await navigator.share(shareData);
            return;
          }
        } catch (e) {
          if (e?.name === "AbortError") return;
        }
        try {
          await navigator.clipboard.writeText(
            shareData.title + "\n" + shareData.text + "\n" + shareData.url
          );
          window.StudioToast?.success?.("Contact copied");
        } catch (_) {
          downloadVCard();
        }
      });
    })();
  </script>
