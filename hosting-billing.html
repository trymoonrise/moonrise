  <script>
    (function () {
      var BUILD = "20260911-live2";
      try {
        var prev = localStorage.getItem("ms_asset_build");
        localStorage.setItem("ms_asset_build", BUILD);
        if (prev && prev !== BUILD && !sessionStorage.getItem("ms_build_reloaded_" + BUILD)) {
          sessionStorage.setItem("ms_build_reloaded_" + BUILD, "1");
          var jobs = [];
          if ("serviceWorker" in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all((regs || []).map(function (r) { return r.unregister(); }));
            }));
          }
          if ("caches" in window) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all((keys || []).map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.allSettled(jobs).then(function () {
            var url = new URL(location.href);
            url.searchParams.set("_ms_b", BUILD);
            location.replace(url.pathname + url.search + url.hash);
          });
        }
      } catch (e) {}
    })();
  </script>

<body data-page="hosting-billing" class="ms-contact-public">
  <header class="ms-orders-nav">
    <a class="ms-home-brand" href="index.html">
      <img src="doc/MoonriseLogo.png" alt="" width="36" height="36">

  <main class="ms-hosting-main">
    <form class="ms-hosting-card" id="hosting-billing-form">
      <h1>Manage or cancel hosting</h1>
      <p>Enter the email you used when you paid to remove the watermark. Weâ€™ll open Stripeâ€™s secure billing portal so you can update your card or cancel.</p>
      <label>
        Project ID
        <input id="hosting-project-id" name="projectId" autocomplete="off" spellcheck="false" required>
      </label>
      <label>
        Checkout email
        <input id="hosting-email" name="email" type="email" autocomplete="email" required placeholder="you@business.com">
      </label>
      <button type="submit" id="hosting-submit">Open billing portal</button>
      <p class="ms-hosting-status" id="hosting-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const projectInput = document.getElementById("hosting-project-id");
      const emailInput = document.getElementById("hosting-email");
      const statusEl = document.getElementById("hosting-status");
      const submitBtn = document.getElementById("hosting-submit");
      const prefill = String(params.get("project") || params.get("projectId") || "").trim();
      if (prefill && projectInput) projectInput.value = prefill;

      function workerBase() {
        const fromConfig = String(window.MS_CONFIG?.workerUrl || window.MS_CONFIG?.WORKER_URL || "").replace(/\/$/, "");
        if (fromConfig) return fromConfig;
        if (/trymoonrise\.com$/i.test(location.hostname) || /vercel\.app$/i.test(location.hostname)) {
          return location.origin;
        }
        return "https://trymoonrise.com";
      }

      function setStatus(msg, kind) {
        if (!statusEl) return;
        statusEl.textContent = msg || "";
        statusEl.classList.toggle("is-error", kind === "error");
        statusEl.classList.toggle("is-ok", kind === "ok");
      }

      document.getElementById("hosting-billing-form")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const projectId = String(projectInput?.value || "").trim();
        const email = String(emailInput?.value || "").trim().toLowerCase();
        if (!projectId || !email) {
          setStatus("Enter project ID and checkout email.", "error");
          return;
        }
        try {
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = "Openingâ€¦";
          }
          setStatus("Opening Stripe billing portalâ€¦");
          const res = await fetch(workerBase() + "/public-hosting-portal", {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ projectId, email }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Could not open billing portal");
          if (!data.url) throw new Error("Billing portal URL missing");
          setStatus("Redirectingâ€¦", "ok");
          location.href = data.url;
        } catch (err) {
          setStatus(err?.message || "Could not open billing portal", "error");
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Open billing portal";
          }
        }
      });
    })();
  </script>
