<!DOCTYPE html>
<html lang="en">
<head>
<style>html.ms-hold body{visibility:hidden!important}</style>
<script>document.documentElement.classList.add("ms-hold");document.addEventListener("DOMContentLoaded",function(){if(!document.getElementById("shell"))document.documentElement.classList.remove("ms-hold")});setTimeout(function(){document.documentElement.classList.remove("ms-hold")},4000);</script>
  <script>
    (function () {
      var BUILD = "20260924-drawer-ease";
      try {
        var prev = localStorage.getItem("ms_asset_build");
        localStorage.setItem("ms_asset_build", BUILD);
        if (prev && prev !== BUILD && !sessionStorage.getItem("ms_build_reloaded_" + BUILD)) {
          sessionStorage.setItem("ms_build_reloaded_" + BUILD, "1");
          var jobs = [];
          if ("serviceWorker" in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all((regs || []).map(function (r) { return r.unregister(); }));
            }));
          }
          if ("caches" in window) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all((keys || []).map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.allSettled(jobs).then(function () {
            var url = new URL(location.href);
            url.searchParams.set("_ms_b", BUILD);
            location.replace(url.pathname + url.search + url.hash);
          });
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Manage hosting - Moonrise</title>
  <meta name="description" content="Manage or cancel Moonrise website hosting after go-live payment.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/fonts.css?v=20261003-fonts">
  <link rel="stylesheet" href="css/studio.css?v=20261003-cal" onload="document.documentElement.classList.remove('ms-hold')">
  <script defer src="js/config.js?v=20261003-avatar"></script>
  <style>
    .ms-hosting-main {
      max-width: 28rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    .ms-hosting-card {
      display: grid;
      gap: 0.85rem;
      padding: 1.35rem 1.25rem;
      border-radius: 16px;
      background: #fff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    .ms-hosting-card h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }
    .ms-hosting-card p {
      margin: 0;
      color: #64748b;
      font-size: 0.92rem;
      line-height: 1.45;
    }
    .ms-hosting-card label {
      display: grid;
      gap: 0.3rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .ms-hosting-card input {
      width: 100%;
      padding: 0.7rem 0.8rem;
      border: 1px solid #dbe3ee;
      border-radius: 10px;
      font: inherit;
      font-size: 0.82rem;
      color: #0f172a;
      background: #fff;
    }
    .ms-hosting-card button {
      margin-top: 0.2rem;
      border: 0;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      background: #0f172a;
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    .ms-hosting-card button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .ms-hosting-status {
      min-height: 1.2rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .ms-hosting-status.is-error { color: #b91c1c; }
    .ms-hosting-status.is-ok { color: #0f766e; }
    .ms-hosting-result {
      display: none;
      gap: 0.45rem;
      padding: 0.85rem 0.9rem;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }
    .ms-hosting-result.is-open { display: grid; }
    .ms-hosting-result strong {
      color: #0f172a;
      font-size: 0.95rem;
    }
    .ms-hosting-result p {
      color: #475569;
    }
    .ms-hosting-result a {
      color: #0f172a;
      font-weight: 650;
    }
  </style>
</head>
<body data-page="hosting-billing" class="ms-contact-public">
  <header class="ms-orders-nav">
    <a class="ms-home-brand" href="index.html">
      <img src="doc/MoonriseLogo.png" alt="" width="36" height="36">
      <strong>moonrise.</strong>
    </a>
    <nav class="ms-orders-nav-links" aria-label="Page">
      <a class="ms-orders-nav-link" href="contact.html">Support</a>
    </nav>
  </header>

  <main class="ms-hosting-main">
    <form class="ms-hosting-card" id="hosting-billing-form">
      <h1>Manage or cancel hosting</h1>
      <p>Enter the email you used when you paid to remove the watermark. We'll show whether hosting is active or already canceled, then open Stripe if you still need to update a card or view receipts.</p>
      <label>
        Project ID
        <input id="hosting-project-id" name="projectId" autocomplete="off" spellcheck="false" required>
      </label>
      <label>
        Checkout email
        <input id="hosting-email" name="email" type="email" autocomplete="email" required placeholder="you@business.com">
      </label>
      <button type="submit" id="hosting-submit">Check hosting</button>
      <div class="ms-hosting-result" id="hosting-result"></div>
      <p class="ms-hosting-status" id="hosting-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const projectInput = document.getElementById("hosting-project-id");
      const emailInput = document.getElementById("hosting-email");
      const statusEl = document.getElementById("hosting-status");
      const submitBtn = document.getElementById("hosting-submit");
      const prefill = String(params.get("project") || params.get("projectId") || "").trim();
      if (prefill && projectInput) projectInput.value = prefill;

      function workerBase() {
        const fromConfig = String(window.MS_CONFIG?.workerUrl || window.MS_CONFIG?.WORKER_URL || "").replace(/\/$/, "");
        if (fromConfig) return fromConfig;
        if (/trymoonrise\.com$/i.test(location.hostname) || /vercel\.app$/i.test(location.hostname)) {
          return location.origin;
        }
        return "https://trymoonrise.com";
      }

      function setStatus(msg, kind) {
        if (!statusEl) return;
        statusEl.textContent = clientMessage(msg);
        statusEl.classList.toggle("is-error", kind === "error");
        statusEl.classList.toggle("is-ok", kind === "ok");
      }

      function clientMessage(msg) {
        const text = String(msg || "");
        if (/stripe key|restricted key|stripe dashboard|required permissions/i.test(text)) {
          return "We couldn't open billing just now. Please try again in a few minutes, or contact support.";
        }
        return text;
      }

      function money(cents, currency) {
        if (cents == null || cents === "") return "";
        const code = String(currency || "usd").toUpperCase();
        try {
          return new Intl.NumberFormat("en-US", { style: "currency", currency: code }).format(Number(cents) / 100);
        } catch (e) {
          return "$" + (Number(cents) / 100).toFixed(2);
        }
      }

      function when(iso) {
        if (!iso) return "";
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return "";
        return date.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
      }

      function showHosting(data) {
        const result = document.getElementById("hosting-result");
        if (!result) return;
        const hosting = data.hosting || {};
        const amount = money(hosting.amountCents, hosting.currency);
        const renews = when(hosting.renewsAt);
        const ended = when(hosting.endedAt);
        let title = "Hosting status";
        let body = "We found the hosting record for this site.";
        if (hosting.state === "canceled") {
          title = "Hosting is canceled";
          body = ended
            ? "This plan was canceled on " + ended + ". You won't be charged again."
            : "This plan is already canceled. You won't be charged again.";
        } else if (hosting.state === "canceling") {
          title = "Hosting will cancel";
          body = renews
            ? "This plan stays active through " + renews + ", then it will not renew."
            : "This plan is set to cancel at the end of the current period.";
        } else if (hosting.state === "past_due") {
          title = "Payment needs attention";
          body = "The latest hosting payment didn't go through. Update the card to keep the site online.";
        } else if (hosting.state === "active") {
          title = "Hosting is active";
          body = [amount ? amount + " per month" : "", renews ? "renews " + renews : ""]
            .filter(Boolean)
            .join(" · ") || "This site's hosting subscription is active.";
        }
        result.replaceChildren();
        const heading = document.createElement("strong");
        heading.textContent = title;
        const copy = document.createElement("p");
        copy.textContent = body;
        result.append(heading, copy);
        if (data.url) {
          const link = document.createElement("a");
          link.href = data.url;
          link.textContent = hosting.state === "canceled" ? "View invoices and receipts" : "Update card or cancel in Stripe";
          result.append(link);
        } else if (data.portalError) {
          const note = document.createElement("p");
          note.textContent = clientMessage(data.portalError);
          result.append(note);
        }
        result.classList.add("is-open");
      }

      document.getElementById("hosting-billing-form")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const projectId = String(projectInput?.value || "").trim();
        const email = String(emailInput?.value || "").trim().toLowerCase();
        if (!projectId || !email) {
          setStatus("Enter project ID and checkout email.", "error");
          return;
        }
        try {
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = "Checking...";
          }
          setStatus("Checking hosting...");
          const res = await fetch(workerBase() + "/public-hosting-portal", {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ projectId, email }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Could not open billing portal");
          showHosting(data);
          if (data.url && data.hosting && data.hosting.state !== "canceled") {
            setStatus("Opening billing portal...", "ok");
            location.href = data.url;
            return;
          }
          setStatus(data.hosting && data.hosting.state === "canceled" ? "" : (data.portalError || ""), data.portalError ? "error" : "ok");
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Check hosting";
          }
        } catch (err) {
          setStatus(err?.message || "Could not open billing portal", "error");
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Check hosting";
          }
        }
      });
    })();
  </script>
</body>
</html>
