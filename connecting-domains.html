<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Moonrise">
  <link rel="apple-touch-icon" href="assets/MoonriseLogo.png">
  <title>Connecting Domains - Moonrise Studio</title>
  <meta name="description" content="Connect a custom domain to a Moonrise site (see Docs).">
  <link rel="canonical" href="https://trymoonrise.com/docs#domains">
  <meta http-equiv="refresh" content="0;url=docs#domains">
  <script>
    (function () {
      var hash = (location.hash || "").replace(/^#/, "");
      var domainHashes = {
        overview: 1,
        before: 1,
        editor: 1,
        dns: 1,
        providers: 1,
        troubleshoot: 1
      };
      location.replace(domainHashes[hash] || !hash ? "docs#domains" : "docs#domains");
    })();
  </script>
</head>
<body>
  <p><a href="docs#domains">Continue to Docs — Custom domains</a></p>
</body>
</html>
