<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe7;--surface:#fffcf8;--ink:#1b1814;--muted:#5e574e;--accent:#1b1814;--on:#f6f3ec;--line:rgba(27,24,20,.14);--r:14px;--sh:0 18px 40px rgba(27,24,20,.08);--d:"Fraunces",Georgia,serif;--s:"Manrope",sans-serif;--max:1120px}
*{box-sizing:border-box}html{font-size:16px}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--s);-webkit-font-smoothing:antialiased}img,video{max-width:100%;display:block;height:auto}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}h1,h2,.brand{font-family:var(--d);font-weight:600;letter-spacing:-.03em;line-height:1.04}h1{font-size:clamp(2.5rem,6vw,4.8rem)}h2{font-size:clamp(1.8rem,3vw,2.7rem)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.w{width:min(var(--max),calc(100% - 40px));margin-inline:auto}.ey{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}.lede{color:var(--muted);max-width:38rem}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:var(--r);border:1px solid transparent;background:var(--accent);color:var(--on);font-weight:700}.gh{background:transparent;color:var(--ink);border-color:var(--line)}.btn[disabled]{opacity:.45;cursor:not-allowed}.fld{display:grid;gap:6px;font-weight:650;font-size:.95rem}.fld input,.fld textarea,.fld select{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:calc(var(--r) - 4px);background:var(--surface)}.fld textarea{min-height:120px;resize:vertical}.hint{color:var(--muted);font-weight:500;font-size:.85rem}.g2{display:grid;grid-template-columns:1fr 1fr;gap:22px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.block{padding:72px 0}@media(max-width:800px){.g2,.g3{grid-template-columns:1fr}.block{padding:48px 0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--surface);padding:8px 12px;z-index:6}.nav{position:sticky;top:0;z-index:5;padding:14px 0}.bar{width:min(860px,calc(100% - 28px));margin:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px;background:color-mix(in srgb,var(--surface) 84%,transparent);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);box-shadow:var(--sh)}.brand{font-size:1.3rem}.links{display:flex;gap:16px;margin-left:auto;color:var(--muted)}.links a{min-height:44px;display:inline-flex;align-items:center}.burger{display:none;width:48px;height:48px;border:0;border-radius:var(--r);background:transparent}@media(max-width:760px){.burger{display:grid;place-items:center;margin-left:auto}.links,.cta{display:none}.nav.is-open .links{display:flex;flex-direction:column;position:absolute;left:16px;right:16px;top:74px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}.nav.is-open .cta{display:inline-flex;margin:8px 16px 4px}}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a><header class="nav" data-nav><div class="bar"><a class="brand" href="#top">Northline</a><button class="burger" type="button" data-burger aria-expanded="false" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><nav class="links" aria-label="Primary"><a href="#work">Work</a><a href="#services">Services</a><a href="#studio">Studio</a><a href="#visit">Visit</a></nav><a class="btn cta" href="#visit">Book</a></div></header><main id="content"></main>
<script>document.querySelectorAll("[data-nav]").forEach((n)=>{const b=n.querySelector("[data-burger]");if(!b)return;b.addEventListener("click",()=>{const on=n.classList.toggle("is-open");b.setAttribute("aria-expanded",on?"true":"false");});});</script>
</body>
</html>
