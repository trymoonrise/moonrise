<!DOCTYPE html>
<html lang="en">
<head>
<!--
  @preset
  id: 0179
  slug: vertical-tabs
  title: Vertical tabs
  category: tabs
  tags: tabs, split-media, soft, modern
  role: ornament
  layout: split-media
  mood: warm, calm, gentle
  pageReady: false
  slots: section-header
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0179 Vertical tabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ea;--surface:#fff;--ink:#2a241f;--muted:#6f655c;--accent:#6e3824;--on:#fffaf6;--line:rgba(42,36,31,.12);--r:18px;--sh:0 16px 36px rgba(90,52,32,.08);--d:"Newsreader",Georgia,serif;--s:"Figtree",sans-serif;--max:1080px}
*{box-sizing:border-box}html{font-size:16px}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--s);-webkit-font-smoothing:antialiased}img,video{max-width:100%;display:block;height:auto}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}h1,h2,.brand{font-family:var(--d);font-weight:600;letter-spacing:-.03em;line-height:1.04}h1{font-size:clamp(2.5rem,6vw,4.8rem)}h2{font-size:clamp(1.8rem,3vw,2.7rem)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.w{width:min(var(--max),calc(100% - 40px));margin-inline:auto}.ey{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}.lede{color:var(--muted);max-width:38rem}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:var(--r);border:1px solid transparent;background:var(--accent);color:var(--on);font-weight:700}.gh{background:transparent;color:var(--ink);border-color:var(--line)}.btn[disabled]{opacity:.45;cursor:not-allowed}.fld{display:grid;gap:6px;font-weight:650;font-size:.95rem}.fld input,.fld textarea,.fld select{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:calc(var(--r) - 4px);background:var(--surface)}.fld textarea{min-height:120px;resize:vertical}.hint{color:var(--muted);font-weight:500;font-size:.85rem}.g2{display:grid;grid-template-columns:1fr 1fr;gap:22px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.block{padding:72px 0}@media(max-width:800px){.g2,.g3{grid-template-columns:1fr}.block{padding:48px 0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.vt{display:grid;grid-template-columns:180px 1fr;min-height:220px}[role=tab]{display:flex;width:100%;text-align:left;min-height:48px;border:0;background:none;color:inherit;padding:0 12px}[aria-selected=true]{background:var(--surface);font-weight:700}@media(max-width:800px){.vt{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="vt" data-tabs><div role="tablist" aria-orientation="vertical"><button role="tab" aria-selected="true" id="v1" aria-controls="vp1">Profile</button><button role="tab" aria-selected="false" id="v2" aria-controls="vp2" tabindex="-1">Access</button></div><div role="tabpanel" id="vp1" style="padding:16px">Name, role, and photo.</div><div role="tabpanel" id="vp2" hidden style="padding:16px">Who can edit the drawings.</div></div>
<script>document.querySelectorAll("[data-tabs]").forEach((r)=>{const bs=[...r.querySelectorAll("[role=tab]")];const ps=[...r.querySelectorAll("[role=tabpanel]")];bs.forEach((b,i)=>b.addEventListener("click",()=>{bs.forEach((x,n)=>{x.setAttribute("aria-selected",n===i?"true":"false");x.tabIndex=n===i?0:-1;});ps.forEach((p,n)=>p.hidden=n!==i);}));});</script>
</body>
</html>
