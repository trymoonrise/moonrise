<style>
:root{--bg:#f3efe7;--surface:#fffcf8;--ink:#1b1814;--muted:#5e574e;--accent:#1b1814;--on:#f6f3ec;--line:rgba(27,24,20,.14);--r:14px;--sh:0 18px 40px rgba(27,24,20,.08);--d:"Fraunces",Georgia,serif;--s:"Manrope",sans-serif;--max:1120px}
*{box-sizing:border-box}html{font-size:16px}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--s);-webkit-font-smoothing:antialiased}img,video{max-width:100%;display:block;height:auto}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}h1,h2,.brand{font-family:var(--d);font-weight:600;letter-spacing:-.03em;line-height:1.04}h1{font-size:clamp(2.5rem,6vw,4.8rem)}h2{font-size:clamp(1.8rem,3vw,2.7rem)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.w{width:min(var(--max),calc(100% - 40px));margin-inline:auto}.ey{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}.lede{color:var(--muted);max-width:38rem}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:var(--r);border:1px solid transparent;background:var(--accent);color:var(--on);font-weight:700}.gh{background:transparent;color:var(--ink);border-color:var(--line)}.btn[disabled]{opacity:.45;cursor:not-allowed}.fld{display:grid;gap:6px;font-weight:650;font-size:.95rem}.fld input,.fld textarea,.fld select{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:calc(var(--r) - 4px);background:var(--surface)}.fld textarea{min-height:120px;resize:vertical}.hint{color:var(--muted);font-weight:500;font-size:.85rem}.g2{display:grid;grid-template-columns:1fr 1fr;gap:22px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.block{padding:72px 0}@media(max-width:800px){.g2,.g3{grid-template-columns:1fr}.block{padding:48px 0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.prose{max-width:40rem}.prose p{margin-top:14px;font-size:1.05rem}
</style>

<body>
<section class="block"><div class="w prose"><p class="ey">About</p><h2>A studio of eight.</h2><p>Northline started as a one-room practice and stayed small on purpose. We take fewer jobs so the people who draw them can still be on site.</p><p>Most work is residential. A few shops each year keep the details sharp.</p></div></section>
