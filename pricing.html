<!DOCTYPE html>
<html lang="en">
<head>
<style>
html.ms-boot body{visibility:hidden!important}
#ms-boot{position:fixed;inset:0;z-index:2147483646;display:grid;place-items:center;align-content:center;gap:1.15rem;background:#f3f5f8;color:#0f172a;visibility:visible!important}
html[data-ms-mode="dark"] #ms-boot{background:#0e1320;color:#e8eef8}
@media (prefers-color-scheme:dark){html:not([data-ms-mode="light"]) #ms-boot{background:#0e1320;color:#e8eef8}}
#ms-boot p{margin:0;font:600 1.35rem/1 system-ui,sans-serif;letter-spacing:-.04em}
#ms-boot .ms-boot-bar{width:7.5rem;height:2px;border-radius:99px;background:rgba(15,23,42,.12);overflow:hidden}
html[data-ms-mode="dark"] #ms-boot .ms-boot-bar{background:rgba(232,238,248,.16)}
#ms-boot .ms-boot-bar span{display:block;height:100%;width:40%;border-radius:inherit;background:currentColor;animation:ms-boot 1.05s ease-in-out infinite}
@keyframes ms-boot{0%{transform:translateX(-120%)}100%{transform:translateX(280%)}}
@media (prefers-reduced-motion:reduce){#ms-boot .ms-boot-bar span{animation:none;width:100%;opacity:.45}}
</style>
<script>
document.documentElement.classList.add("ms-boot");
(function(){
  var boot=document.createElement("div");
  boot.id="ms-boot";
  boot.setAttribute("role","status");
  boot.setAttribute("aria-label","Loading");
  boot.innerHTML='<p>moonrise.</p><div class="ms-boot-bar" aria-hidden="true"><span></span></div>';
  document.documentElement.appendChild(boot);
  window.__msReleaseBoot=function(){
    if(window.__msBootReleased)return;
    window.__msBootReleased=1;
    var finish=function(){
      document.documentElement.classList.remove("ms-boot","ms-hold");
      document.documentElement.classList.add("ms-boot-done");
      var el=document.getElementById("ms-boot");
      if(el)el.remove();
    };
    var paint=function(){requestAnimationFrame(function(){requestAnimationFrame(finish);});};
    if(document.fonts&&document.fonts.ready){
      Promise.race([document.fonts.ready.catch(function(){}),new Promise(function(r){setTimeout(r,800);})]).then(paint);
    }else paint();
  };
  setTimeout(function(){ if(window.__msReleaseBoot) window.__msReleaseBoot(); },20000);
})();
</script>
  <script>
    (function () {
      var BUILD = "20260924-drawer-ease";
      try {
        var prev = localStorage.getItem("ms_asset_build");
        localStorage.setItem("ms_asset_build", BUILD);
        if (prev && prev !== BUILD && !sessionStorage.getItem("ms_build_reloaded_" + BUILD)) {
          sessionStorage.setItem("ms_build_reloaded_" + BUILD, "1");
          var jobs = [];
          if ("serviceWorker" in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all((regs || []).map(function (r) { return r.unregister(); }));
            }));
          }
          if ("caches" in window) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all((keys || []).map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.allSettled(jobs).then(function () {
            var url = new URL(location.href);
            url.searchParams.set("_ms_b", BUILD);
            location.replace(url.pathname + url.search + url.hash);
          });
        }
      } catch (e) {}
    })();
  </script>

<body data-page="pricing">
  <div id="shell"></div>
  <div id="page-body" class="ms-settings-page ms-pricing-page">

      <div class="ms-pricing-head-row">
        <h1>Pricing</h1>
        <button type="button" class="ms-pricing-manage" id="btn-billing-portal" hidden>Manage billing</button>

    <div class="ms-pricing-content">

              max="1000"

              value="25"

            Developer credits
