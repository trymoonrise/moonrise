<style>
html.ms-boot body{visibility:hidden!important}
#ms-boot{position:fixed;inset:0;z-index:2147483646;display:grid;place-items:center;align-content:center;gap:1.15rem;background:#fcfbef;color:#232427;visibility:visible!important}
#ms-boot p{margin:0;font:600 1.35rem/1 system-ui,sans-serif;letter-spacing:-.04em}
#ms-boot .ms-boot-bar{width:7.5rem;height:2px;border-radius:99px;background:rgba(15,23,42,.12);overflow:hidden}
#ms-boot .ms-boot-bar span{display:block;height:100%;width:0%;border-radius:inherit;background:currentColor;transform-origin:left center}
@media (prefers-reduced-motion:reduce){#ms-boot .ms-boot-bar span{transition:none}}
</style>
<script>
document.documentElement.classList.add("ms-boot");
(function(){
  var boot=document.createElement("div");
  boot.id="ms-boot";
  boot.setAttribute("role","progressbar");
  boot.setAttribute("aria-label","Loading");
  boot.setAttribute("aria-valuemin","0");
  boot.setAttribute("aria-valuemax","100");
  boot.setAttribute("aria-valuenow","0");
  boot.innerHTML='<p>moonrise.</p><div class="ms-boot-bar" aria-hidden="true"><span></span></div>';
  document.documentElement.appendChild(boot);
  var bar=boot.querySelector(".ms-boot-bar span");
  var progress=0;
  var ready=false;
  var done=false;
  var started=performance.now();
  var readyAt=0;
  var minMs=750;
  var maxMs=20000;
  var reduce=false;
  try{reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}

  function setProgress(p){
    progress=Math.max(0,Math.min(100,p));
    if(bar) bar.style.width=progress.toFixed(2)+"%";
    boot.setAttribute("aria-valuenow",String(Math.round(progress)));
    boot.setAttribute("aria-label","Loading "+Math.round(progress)+"%");
  }

  function finish(){
    if(done)return;
    done=true;
    window.__msBootReleased=1;
    setProgress(100);
    var hide=function(){
      document.documentElement.classList.remove("ms-boot","ms-hold");
      document.documentElement.classList.add("ms-boot-done");
      var el=document.getElementById("ms-boot");
      if(el)el.remove();
    };
    requestAnimationFrame(function(){requestAnimationFrame(hide);});
  }

  function tick(now){
    if(done)return;
    var elapsed=now-started;
    if(ready){
      if(reduce){
        setProgress(100);
        finish();
        return;
      }
      var sinceReady=Math.max(0,now-readyAt);
      var minLeft=Math.max(0,minMs-elapsed);
      var fillMs=Math.max(220,minLeft);
      var t=Math.min(1,sinceReady/fillMs);
      var eased=1-Math.pow(1-t,3);
      setProgress(Math.max(progress, 88+(12*eased)));
      if(t>=1 && progress>=99.5){
        setProgress(100);
        finish();
        return;
      }
    }else{
      var tWait=Math.min(1,elapsed/2600);
      var target=82*(1-Math.pow(1-tWait,2.4));
      setProgress(progress+(target-progress)*0.16);
      if(elapsed>=maxMs){
        ready=true;
        readyAt=now;
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.__msReleaseBoot=function(){
    if(ready||done)return;
    ready=true;
    readyAt=performance.now();
  };
  setTimeout(function(){ if(window.__msReleaseBoot) window.__msReleaseBoot(); },maxMs);
})();
</script>
  <script>
    (function () {
      var BUILD = "20260930-channel-instant";
      try {
        var prev = localStorage.getItem("ms_asset_build");
        localStorage.setItem("ms_asset_build", BUILD);
        if (prev && prev !== BUILD && !sessionStorage.getItem("ms_build_reloaded_" + BUILD)) {
          sessionStorage.setItem("ms_build_reloaded_" + BUILD, "1");
          var jobs = [];
          if ("serviceWorker" in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all((regs || []).map(function (r) { return r.unregister(); }));
            }));
          }
          if ("caches" in window) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all((keys || []).map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.allSettled(jobs).then(function () {
            var url = new URL(location.href);
            url.searchParams.set("_ms_b", BUILD);
            location.replace(url.pathname + url.search + url.hash);
          });
        }
      } catch (e) {}
    })();
  </script>

<body data-page="dashboard">
  <div id="shell"></div>
  <div id="page-body" class="ms-dash-page ms-settings-page">
    <header class="ms-page-head">
      <div class="ms-page-head-copy">
        <h1>Dashboard</h1>
      </div>
    </header>

    <div class="ms-settings-stack ms-dash-stack">
      <section class="ms-card ms-settings-card ms-dash-card ms-dash-progress-card" aria-label="Overview">
        <div class="ms-dash-hero">
          <div class="ms-dash-hero-copy">
            <p class="ms-dash-hero-label">Income</p>
            <p class="ms-dash-hero-value" id="stat-commission">$0.00</p>
            <p class="ms-dash-hero-hint">Your 90% share</p>
          </div>
          <div class="ms-dash-hero-pct">
            <p class="ms-dash-ring-progress">
              <span class="ms-dash-ring-value" id="stat-goal-pct">0%</span>
            </p>
            <p class="ms-dash-ring-kicker">of goal</p>
          </div>
        </div>
        <div class="ms-dash-bar ms-dash-ring" role="img" aria-label="0 percent of income goal">
          <span class="ms-dash-bar-fill" id="stat-goal-ring"></span>
        </div>
        <p class="ms-dash-ring-sub ms-dash-bar-caption">
          <span id="stat-goal-left">$1,000.00</span>
          <span id="stat-goal-left-label">left</span>
        </p>
        <div class="ms-dash-overview">
          <div class="ms-dash-overview-grid" aria-label="Key metrics">
            <div class="ms-dash-metric ms-dash-metric--goal" id="stat-goal-wrap">
              <span class="ms-dash-metric-label">Goal <span class="ms-dash-metric-edit">Edit</span></span>
              <button type="button" class="ms-dash-metric-value ms-dash-goal-display" id="stat-goal" title="Click to edit income goal" aria-label="Income goal $1,000, click to edit">$1,000</button>
              <input class="ms-dash-goal-input" id="stat-goal-input" type="number" inputmode="numeric" min="1" max="1000000" step="1" value="1000" aria-label="Edit income goal" hidden>
              <span class="ms-dash-metric-hint">Lifetime target</span>
            </div>
            <div class="ms-dash-metric ms-dash-metric--sales">
              <span class="ms-dash-metric-label">Sales</span>
              <strong class="ms-dash-metric-value" id="dash-sales-progress">0</strong>
              <span class="ms-dash-metric-hint">Paid sites</span>
            </div>
            <div class="ms-dash-metric ms-dash-metric--avg">
              <span class="ms-dash-metric-label">Average</span>
              <strong class="ms-dash-metric-value" id="stat-avg-sale">-</strong>
              <span class="ms-dash-metric-hint">Per paid site</span>
            </div>
          </div>
          <a class="ms-btn ms-dash-tool" href="leads.html">Find a lead</a>
        </div>
      </section>

      <section class="ms-dash-posts" id="recent-projects" aria-label="Recent posts">
        <button
          type="button"
          class="ms-dash-projects-toggle"
          id="dash-projects-toggle"
          aria-expanded="false"
          aria-controls="dash-projects-reveal"
        >
          <span class="ms-dash-projects-toggle-main">
            <span class="ms-dash-projects-title">Recent posts</span>
            <span class="ms-dash-count-badge" id="dash-projects-count">0 projects</span>
          </span>
          <svg class="ms-dash-projects-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <div class="ms-dash-posts-reveal" id="dash-projects-reveal" hidden>
          <div class="ms-dash-projects-body" id="dash-projects-panel">
            <div class="ms-dash-projects-search" id="dash-projects-search-wrap">
              <label class="ms-sr-only" for="dash-projects-search">Search projects</label>
              <div class="ms-dash-projects-search-row">
                <div class="ms-dash-projects-search-field">
                  <input
                    type="search"
                    id="dash-projects-search"
                    class="ms-dash-projects-search-input"
                    placeholder="Search name, location, category, phone, domain..."
                    autocomplete="off"
                    spellcheck="false"
                    aria-autocomplete="list"
                    aria-controls="dash-projects-suggest"
                    aria-expanded="false"
                  >
                  <button type="button" class="ms-dash-projects-search-clear" id="dash-projects-search-clear" hidden aria-label="Clear search">×</button>
                </div>
                <button type="button" class="ms-dash-filter-btn" id="dash-projects-filter-open" aria-expanded="false" aria-controls="dash-projects-filters" aria-label="Filter posts">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6.2 7.4V19l-3.6 1.6v-8.2L4 5z"/></svg>
                </button>
              </div>
              <div class="ms-dash-projects-filters" id="dash-projects-filters" role="group" aria-label="Filter by live status">
                <button type="button" class="ms-dash-projects-filter is-active" data-live-filter="all" aria-pressed="true">All</button>
                <button type="button" class="ms-dash-projects-filter" data-live-filter="live" aria-pressed="false">Live</button>
                <button type="button" class="ms-dash-projects-filter" data-live-filter="not-live" aria-pressed="false">Not live</button>
              </div>
              <ul class="ms-dash-projects-suggest" id="dash-projects-suggest" role="listbox" hidden></ul>
              <p class="ms-dash-projects-search-hint" id="dash-projects-search-hint" hidden></p>
            </div>
          </div>
          <div class="ms-dash-previews" id="dash-projects-list"></div>
        </div>
      </section>
    </div>
  </div>
